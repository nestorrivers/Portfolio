[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "public-data-aggregator"
version = "0.1.0"
description = "A framework-agnostic library for ingesting and normalising UK public RSS data (weather, traffic, and more)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Nestor" }
]
keywords = [
    "rss",
    "public-data",
    "weather",
    "traffic",
    "data-ingestion",
    "normalisation"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries"
]


dependencies = [
    "requests>=2.31",
    "feedparser>=6.0",
    "python-dateutil>=2.9",
    "pydantic>=2.6",
    "typing-extensions>=4.10"
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",        # HTTP mocking
    "ruff>=0.3",
    "mypy>=1.8",
    "types-requests>=2.31",
]

cli = [
    "rich>=13.7"
]


[project.scripts]
public-data = "public_data.cli:main"


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"


[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true


[tool.ruff]
line-length = 88
target-version = "py311"
fix = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "B",    # bugbear
    "I",    # isort
    "UP",   # pyupgrade
    "SIM",  # simplify
]
ignore = [
    "E501"  # handled by formatter
]
